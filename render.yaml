services:
  - type: web
    name: burton-dofe-live-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --worker-class gthread --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: OS_API_KEY
        sync: false
      - key: TRACKERS
        sync: false
      - key: DATA_DIR
        value: /var/data
